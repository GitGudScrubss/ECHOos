      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#0b0d1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- frames -->
  <g fill="none" stroke="url(#glow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="96" width="78" height="62" rx="24"/>
    <rect x="144" y="96" width="78" height="62" rx="24"/>
    <path d="M112 116 q16 -12 32 0"/>
