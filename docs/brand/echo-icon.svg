    <path d="M52 136 a21 21 0 0 1 42 0" stroke-width="4" stroke-opacity="0.55"/>
    <path d="M170 127 a13 13 0 0 1 26 0" stroke-width="5" stroke-opacity="0.95"/>
    <path d="M162 136 a21 21 0 0 1 42 0" stroke-width="4" stroke-opacity="0.55"/>
  </g>
  <circle cx="73" cy="133" r="4.5" fill="#7cc4ff"/>
  <circle cx="183" cy="133" r="4.5" fill="#7cc4ff"/>
  <text x="128" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#e8eaed">ECHO</text>
</svg>
